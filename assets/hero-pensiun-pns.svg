<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Ilustrasi simulasi pensiun PNS</title><desc id="desc">Lembar perhitungan pensiun dengan kalkulator, grafik persentase, dan catatan dasar pensiun.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#d9e6ff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#283f79" flood-opacity=".16"/></filter></defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><circle cx="1010" cy="126" r="118" fill="#c9d5ff" opacity=".7"/><circle cx="155" cy="565" r="150" fill="#d7f0e8" opacity=".8"/>
<g filter="url(#shadow)" transform="rotate(-4 520 330)"><rect x="270" y="105" width="510" height="465" rx="24" fill="#fff"/><rect x="310" y="145" width="430" height="75" rx="14" fill="#f1f4ff"/><text x="338" y="178" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#596987">SIMULASI PENSIUN POKOK</text><text x="338" y="205" font-family="Arial,sans-serif" font-size="16" fill="#7886a3">Dasar pensiun × persentase masa kerja</text>
<rect x="310" y="250" width="430" height="94" rx="16" fill="#355cf6"/><text x="340" y="286" font-family="Arial,sans-serif" font-size="16" fill="#dbe4ff">PERKIRAAN PER BULAN</text><text x="340" y="326" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Rp3.250.000</text>
<text x="315" y="390" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#29385e">Masa kerja yang diakui</text><text x="680" y="390" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#526181">26 tahun</text><rect x="315" y="410" width="365" height="12" rx="6" fill="#e8ecf8"/><rect x="315" y="410" width="237" height="12" rx="6" fill="#50b696"/>
<text x="315" y="461" font-family="Arial,sans-serif" font-size="15" fill="#667493">2,5% × 26 tahun = 65% dari dasar pensiun</text><text x="315" y="505" font-family="Arial,sans-serif" font-size="14" fill="#8490a8">Hanya simulasi awal, bukan penetapan resmi.</text></g>
<g transform="translate(835 225)"><rect width="220" height="245" rx="22" fill="#fff" opacity=".9"/><text x="28" y="46" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#596987">CEK DULU</text><circle cx="42" cy="91" r="14" fill="#54b394"/><path d="m35 91 5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="97" font-family="Arial,sans-serif" font-size="15" fill="#354261">Gaji pokok</text><circle cx="42" cy="137" r="14" fill="#54b394"/><path d="m35 137 5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="143" font-family="Arial,sans-serif" font-size="15" fill="#354261">Masa kerja</text><circle cx="42" cy="183" r="14" fill="#54b394"/><path d="m35 183 5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="189" font-family="Arial,sans-serif" font-size="15" fill="#354261">Aturan berlaku</text></g></svg>