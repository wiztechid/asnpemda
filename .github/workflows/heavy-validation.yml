name: Heavy Validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heavy-validation
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Full deterministic audit
        run: |
          set -euo pipefail
          python scripts/validate.py
          python scripts/site_audit.py
          python scripts/test_pipeline.py
          python scripts/test_security.py
          python scripts/test_secure_fetch.py
          python scripts/security_gate.py
          python scripts/delta_check.py
          python scripts/build.py
          python scripts/release_audit.py
          echo "TECHNICAL AUDIT COMPLETE; RELEASE DECISION HOLD"
