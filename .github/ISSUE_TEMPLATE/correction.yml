name: Koreksi atau pembaruan informasi
description: Laporkan kekeliruan atau sumber resmi baru pada artikel ASN Pemda
title: "[Koreksi] "
body:
  - type: markdown
    attributes:
      value: |
        Laporan ini akan terlihat publik. Jangan tulis NIK, nomor telepon, alamat, dokumen internal, atau data pribadi orang lain.
  - type: input
    id: page_url
    attributes:
      label: URL halaman
      description: Tautan artikel ASN Pemda yang dilaporkan.
      placeholder: https://asnpemda.pages.dev/artikel/...
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Jenis laporan
      options:
        - Fakta perlu dikoreksi
        - Ada sumber resmi yang lebih baru
        - Cakupan/status kebijakan perlu diperjelas
        - Salah ketik atau tautan rusak
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Bagian dan penjelasan
      description: Jelaskan bagian yang dimaksud dan alasan laporan.
      placeholder: Kutip seperlunya, tanpa data pribadi.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Tautan sumber pendukung
      description: Utamakan regulasi, JDIH, atau kanal resmi instansi.
      placeholder: https://...
    validations:
      required: false
