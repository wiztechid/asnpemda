name: Heavy Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavy-validation
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Foundation audit
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/EDITORIAL_CONTRACT.md
          test -f docs/AUTOMATION_POLICY.md
          test -f schemas/living-policy.schema.json
          python -m json.tool schemas/living-policy.schema.json >/dev/null
          echo "Foundation audit PASS"
