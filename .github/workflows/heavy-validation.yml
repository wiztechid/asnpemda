name: Heavy Validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heavy-validation
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Foundation and editorial audit
        run: |
          set -euo pipefail
          python scripts/validate.py
          python scripts/site_audit.py
          python scripts/delta_check.py
          test -f docs/MVP_RELEASE_GATE.md
          test -f docs/CONTENT_MODEL.md
          grep -q 'noindex,follow' artikel/gaji-asn-melalui-koperasi.html
          echo "Foundation audit PASS; NOT a publication approval"
