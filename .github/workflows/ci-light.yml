name: CI Light

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-light-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          find schemas data -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done
