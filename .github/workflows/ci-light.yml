name: CI Light
on:
  pull_request:
    paths: ['data/**','schemas/**','scripts/**','.github/workflows/**','**/*.html','assets/**','robots.txt','site-config.json']
  push:
    branches: [main]
    paths: ['data/**','schemas/**','scripts/**','.github/workflows/**','**/*.html','assets/**','robots.txt','site-config.json']
permissions:
  contents: read
concurrency:
  group: ci-light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate data, links and safety
        run: |
          python scripts/validate.py
          python scripts/site_audit.py
          python scripts/test_pipeline.py
          python scripts/test_security.py
          python scripts/test_secure_fetch.py
          python scripts/security_gate.py
