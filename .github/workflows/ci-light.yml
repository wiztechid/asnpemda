name: CI Light
on:
  pull_request:
    paths: ['data/**','schemas/**','scripts/**','.github/workflows/**','**/*.html','assets/**','robots.txt']
  push:
    branches: [main]
    paths: ['data/**','schemas/**','scripts/**','.github/workflows/**','**/*.html','assets/**','robots.txt']
permissions:
  contents: read
concurrency:
  group: ci-light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate data and local links
        run: |
          python scripts/validate.py
          python scripts/site_audit.py
